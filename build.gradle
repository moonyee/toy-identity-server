plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.platform.auth'
version = '0.0.1-SNAPSHOT'
description = 'identity-service'

java {
    toolchain {
        // Java 21로 업그레이드. Virtual Threads(JEP 444) 정식 지원을 받기 위함.
        // Spring Boot 3.5.x는 Java 21을 공식 지원한다.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // OpenAPI 3 / Swagger UI. springdoc 2.7.x 는 Spring Boot 3.3~3.5 공식 호환.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    testImplementation 'org.springframework.security:spring-security-test'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JJWT 3개 모듈은 반드시 동일 버전으로 맞춘다.
    // 섞여 있으면 0.12.x에만 있는 io.jsonwebtoken.security.SecureRequest 같은 클래스가
    // 런타임에 누락되어 NoClassDefFoundError가 발생한다.
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // DelegatingPasswordEncoder가 Argon2/SCrypt를 실제로 실행할 때 필요.
    // 없으면 런타임에 NoClassDefFoundError/Illegal block size 류 예외가 난다.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78'
}

tasks.named('test') {
    useJUnitPlatform()
}
