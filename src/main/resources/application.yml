server:
  port: 8182 # 게이트웨이에서 라우팅하는 포트와 일치해야 함

jwt:
  secret: my_super_secret_key_that_is_long_enough_and_random # JWT 서명에 사용할 비밀키, 추후 별도 모듈로 이동필요

jasypt:
  encryptor:
    bean: jasyptStringEncryptor
    password: "dev-test-key-001"
    property:
      prefix: "ENC("
      suffix: ")"

auth:
  max-session: 3

spring:
  jpa:
    hibernate:
      # update: 엔티티와 테이블 비교 후 변경분만 반영 (개발 서버)
      ddl-auto: update
    show-sql: true        # 콘솔에 SQL 로그 출력
    properties:
      hibernate:
        format_sql: true  # SQL을 보기 좋게 정렬
        dialect: org.hibernate.dialect.MariaDBDialect # MariaDB 방언 설정
  datasource:
    url: jdbc:mariadb://localhost:3306/identity_db
    username: ENC(PRcB7CdnDoSqh4NGNAVmPwyHQe7drke78GRPyzPogJE=)
    password: ENC(Ych4NlmpR1CxD60mytthQKhvVL/a8nc8)
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      enabled: false
      service:
        mapping:
          redis-identity-master: redis
  spring:
    sql:
      init:
        mode: always # never
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
  main:
    allow-bean-definition-overriding: true
  webflux:
    base-path: /api
  servlet:
    encoding:
      charset: UTF-8